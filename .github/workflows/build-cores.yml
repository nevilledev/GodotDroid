name: Build and Release CI Cores (Godot 4.5 & 4.6.3)

on:
  workflow_dispatch:
  push:
    branches:
      - ci-built-cores

concurrency:
  group: build-cores-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-core:
    name: Build Godot ${{ matrix.version_key }} Core (arm64-v8a)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - version_key: "4.6"
            godot_version: "4.6.3-stable"
            godot_tag: "4.6.3-stable"
            engine_version: "4.6.3"
            engine_major: 4
            display_name: "Godot 4.6 Stable"
          - version_key: "4.5"
            godot_version: "4.5-stable"
            godot_tag: "4.5-stable"
            engine_version: "4.5.0"
            engine_major: 4
            display_name: "Godot 4.5 Stable"

    steps:
      - name: Checkout GodotDroid Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.11
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.11'

      - name: Install SCons Build Tool
        run: pip install scons

      - name: Set up Java 17
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android NDK (r25b)
        uses: nttld/setup-ndk@afb4c9964b521afb97c864b7d40b11e6911bd410 # v1.5.0
        with:
          ndk-version: r25b
          link-to-sdk: true

      - name: Configure Android Build-Tools and d8
        run: |
          BUILD_TOOLS_DIR=$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 | sort -V | tail -n 1)
          echo "$BUILD_TOOLS_DIR" >> $GITHUB_PATH
          echo "Configured Android build-tools at $BUILD_TOOLS_DIR"

      - name: Clone Godot Engine (${{ matrix.godot_tag }})
        run: |
          git clone --depth 1 --branch ${{ matrix.godot_tag }} https://github.com/godotengine/godot.git godot-src

      - name: Check SConstruct for disable_path_overrides Option
        id: check_option
        working-directory: godot-src
        run: |
          if grep -q "disable_path_overrides" SConstruct; then
            echo "Option disable_path_overrides found in SConstruct. Setting disable_path_overrides=no"
            echo "EXTRA_SCONS_FLAGS=disable_path_overrides=no" >> $GITHUB_ENV
          else
            echo "Option disable_path_overrides not present in this Godot version. Skipping option."
            echo "EXTRA_SCONS_FLAGS=" >> $GITHUB_ENV
          fi

      - name: Compile Godot Android ARM64 Release Template
        working-directory: godot-src
        run: |
          scons platform=android target=template_release arch=arm64 ${{ env.EXTRA_SCONS_FLAGS }} -j$(nproc)

      - name: Build Android Templates via Gradle
        working-directory: godot-src/platform/android/java
        run: |
          ./gradlew generateGodotTemplates || ./gradlew :lib:assembleRelease

      - name: Package Core Archive (core_${{ matrix.version_key }}.zip)
        id: package_core
        run: |
          mkdir -p output_core staging

          # 1. Locate compiled libgodot_android.so
          SO_SRC=$(find godot-src/bin godot-src/platform/android/java -name "*.so" | grep -E "template_release.*arm64|libgodot_android\.so" | head -n 1)
          if [ -z "$SO_SRC" ]; then
            echo "Error: libgodot_android.so not found!"
            find godot-src -name "*.so"
            exit 1
          fi
          echo "Found engine library: $SO_SRC"
          cp "$SO_SRC" staging/libgodot_android.so

          # 2. Locate or extract libc++_shared.so from NDK sysroot
          NDK_LIBCXX="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so"
          if [ -f "$NDK_LIBCXX" ]; then
            echo "Copying libc++_shared.so from NDK: $NDK_LIBCXX"
            cp "$NDK_LIBCXX" staging/libc++_shared.so
          else
            echo "Searching for libc++_shared.so in build tree..."
            LIBCXX_SRC=$(find godot-src -name "libc++_shared.so" | head -n 1)
            if [ -n "$LIBCXX_SRC" ]; then
              cp "$LIBCXX_SRC" staging/libc++_shared.so
            else
              echo "Error: libc++_shared.so could not be located"
              exit 1
            fi
          fi

          # 3. Locate classes.dex or compile via d8 from AAR
          if [ -f "godot-src/bin/android_release.apk" ] && unzip -l "godot-src/bin/android_release.apk" | grep -q "classes.dex"; then
            echo "Extracting classes.dex from generated android_release.apk..."
            unzip -p "godot-src/bin/android_release.apk" classes.dex > staging/godot-lib.dex
          else
            AAR_FILE=$(find godot-src/platform/android/java -name "*.aar" | head -n 1)
            if [ -n "$AAR_FILE" ]; then
              echo "Extracting classes.jar from $AAR_FILE and converting via d8..."
              unzip -p "$AAR_FILE" classes.jar > /tmp/classes.jar
              d8 --output staging/ /tmp/classes.jar
              mv staging/classes.dex staging/godot-lib.dex
              rm /tmp/classes.jar
            else
              DEX_SRC=$(find godot-src -name "classes.dex" | head -n 1)
              if [ -n "$DEX_SRC" ]; then
                cp "$DEX_SRC" staging/godot-lib.dex
              else
                echo "Error: classes.dex / AAR not found!"
                exit 1
              fi
            fi
          fi

          # 4. Generate internal core_manifest.json (SHA-256 of libgodot_android.so)
          SO_SHA256=$(sha256sum staging/libgodot_android.so | awk '{print $1}')
          cat <<EOF > staging/core_manifest.json
          {
            "versionKey": "${{ matrix.version_key }}",
            "displayName": "${{ matrix.display_name }}",
            "engineVersion": "${{ matrix.engine_version }}",
            "sha256": "$SO_SHA256"
          }
          EOF

          # 5. Package ZIP archive directly into output_core (no self-mv)
          (cd staging && zip -9 -r "../output_core/core_${{ matrix.version_key }}.zip" libgodot_android.so libc++_shared.so godot-lib.dex core_manifest.json)

          ZIP_SHA256=$(sha256sum "output_core/core_${{ matrix.version_key }}.zip" | awk '{print $1}')
          ZIP_SIZE=$(stat -c%s "output_core/core_${{ matrix.version_key }}.zip")

          cat <<EOF > "output_core/meta_${{ matrix.version_key }}.json"
          {
            "versionKey": "${{ matrix.version_key }}",
            "displayName": "${{ matrix.display_name }}",
            "engineVersion": "${{ matrix.engine_version }}",
            "engineMajor": ${{ matrix.engine_major }},
            "fileName": "core_${{ matrix.version_key }}.zip",
            "sha256": "$ZIP_SHA256",
            "sizeBytes": $ZIP_SIZE,
            "downloadUrl": "https://github.com/${{ github.repository }}/releases/download/cores-latest/core_${{ matrix.version_key }}.zip",
            "isRecommended": false
          }
          EOF

      - name: Upload Single Core Artifact
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: core-${{ matrix.version_key }}
          path: output_core/*

  package-release-artifacts:
    name: Package CI Cores & Manifest Bundle
    needs: build-core
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download Built Core Artifacts
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          path: ./downloaded_artifacts

      - name: Merge cores_manifest.json
        run: |
          mkdir -p ./release_dist
          find ./downloaded_artifacts -name "*.zip" -exec cp {} ./release_dist/ \;

          python - << 'PYEOF'
          import json, glob, urllib.request

          # 1. Fetch current remote manifest to preserve existing entries (3.5 to 4.4, etc.)
          manifest_url = "https://github.com/${{ github.repository }}/releases/download/cores-latest/cores_manifest.json"
          try:
              req = urllib.request.Request(manifest_url, headers={'User-Agent': 'GodotDroid-CI'})
              with urllib.request.urlopen(req) as resp:
                  remote_entries = json.loads(resp.read().decode('utf-8'))
          except Exception as e:
              print("Notice: Could not fetch remote manifest, falling back to empty:", e)
              remote_entries = []

          # 2. Collect newly built core entries
          new_entries = {}
          for meta_file in glob.glob("./downloaded_artifacts/**/meta_*.json", recursive=True):
              with open(meta_file, "r", encoding="utf-8") as f:
                  data = json.load(f)
                  new_entries[data["versionKey"]] = data

          # 3. Merge: preserve all existing entries and replace/add new ones
          merged = []
          seen_keys = set()
          for key, entry in new_entries.items():
              merged.append(entry)
              seen_keys.add(key)

          for old in remote_entries:
              if old.get("versionKey") not in seen_keys:
                  merged.append(old)
                  seen_keys.add(old.get("versionKey"))

          # Sort descending by versionKey (comparing major and minor as integers)
          def sort_key(item):
              vk = item.get("versionKey", "0")
              parts = vk.split(".")
              res = []
              for p in parts:
                  res.append(int(p) if p.isdigit() else p)
              return res

          merged.sort(key=sort_key, reverse=True)

          with open("./release_dist/cores_manifest.json", "w", encoding="utf-8") as f:
              json.dump(merged, f, indent=2)

          print("Merged cores_manifest.json successfully:")
          print(json.dumps(merged, indent=2))
          PYEOF

      - name: Upload Cores Bundle Artifact (for testing prior to release)
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: cores-bundle
          path: |
            ./release_dist/core_4.5.zip
            ./release_dist/core_4.6.zip
            ./release_dist/cores_manifest.json

  publish-cores:
    name: Publish Cores to Release (cores-latest)
    needs: package-release-artifacts
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download Cores Bundle Artifact
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: cores-bundle
          path: ./release_dist

      - name: Publish to GitHub Release (cores-latest)
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          tag_name: cores-latest
          name: GodotDroid Runtime Cores (Latest)
          draft: false
          prerelease: false
          files: |
            ./release_dist/core_4.5.zip
            ./release_dist/core_4.6.zip
            ./release_dist/cores_manifest.json
